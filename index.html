<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TREMOR</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #12161b; --line: #222a33; --fg: #dfe6ee; --dim: #7d8a98;
    --accent: #ff6a1a; --ok: #4ade80; --err: #f87171; --blocked: #94a3b8;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --head: Impact, "Arial Narrow Bold", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px; background-position: -1px -1px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font: 44px/1 var(--head); letter-spacing: .04em; margin: 0; color: var(--accent); }
  .sub { color: var(--dim); margin: 4px 0 20px; }
  form, .card { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
  form { display: grid; gap: 10px; margin-bottom: 18px; }
  label { display: grid; gap: 4px; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 10px; width: 100%; border-radius: 0; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; cursor: pointer; color: var(--fg); background: transparent; border: 1px solid var(--dim); padding: 9px 14px; border-radius: 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #140700; font-weight: 700; }
  button:disabled { opacity: .5; cursor: wait; }
  .msg { min-height: 20px; margin: 0 0 12px; color: var(--accent); overflow-wrap: anywhere; }
  .msg.bad { color: var(--err); }
  .card { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .name { font-weight: 700; font-size: 16px; }
  .url { color: var(--dim); overflow-wrap: anywhere; font-size: 12px; }
  .pill { font-size: 11px; padding: 1px 8px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: .08em; }
  .pill.ok { color: var(--ok); } .pill.error { color: var(--err); }
  .pill.blocked { color: var(--blocked); } .pill.pending { color: var(--dim); }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--dim); font-size: 12px; margin: 8px 0; }
  .meta b { color: var(--fg); font-weight: 500; }
  .err { color: var(--err); font-size: 12px; overflow-wrap: anywhere; }
  svg.trace { display: block; width: 100%; height: 44px; margin: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .hist { margin-top: 10px; font-size: 12px; color: var(--dim); }
  .hist div { padding: 4px 0; border-top: 1px dashed var(--line); overflow-wrap: anywhere; }
  .hist a { color: var(--accent); }
  .empty { color: var(--dim); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>TREMOR</h1>
  <p class="sub">A seismograph for the web. Add a page, then check it.</p>

  <form id="add">
    <label>Name <input id="name" required maxlength="80" placeholder="Example homepage"></label>
    <label>URL <input id="url" type="url" required placeholder="https://example.com"></label>
    <label>Check every
      <select id="interval">
        <option value="15">15 minutes</option><option value="60" selected>1 hour</option>
        <option value="360">6 hours</option><option value="1440">24 hours</option>
      </select>
    </label>
    <button class="primary" id="addBtn" type="submit">Add and check now</button>
  </form>

  <p class="msg" id="msg" role="status"></p>
  <div id="list"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (t) => t ? new Date(t).toLocaleString() : "never";

function say(text, bad) { const m = $("msg"); m.textContent = text; m.className = "msg" + (bad ? " bad" : ""); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = r.status === 204 ? null : await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((data && data.error) || "Request failed (" + r.status + ")");
  return data;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function trace(checks) {
  // flat line = nothing changed, spike up = content changed, spike down = error or blocked
  const ns = "http://www.w3.org/2000/svg", W = 300, H = 44, mid = 22;
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("preserveAspectRatio", "none"); svg.setAttribute("class", "trace");
  const pts = checks.slice().reverse().slice(-60);
  const step = pts.length > 1 ? (W - 12) / (pts.length - 1) : 0;
  let d = "M0 " + mid;
  pts.forEach((c, i) => {
    const x = pts.length > 1 ? 6 + i * step : W / 2;
    const y = c.outcome === "changed" ? 4 : (c.outcome === "error" || c.outcome === "blocked") ? 40 : mid;
    if (y !== mid) d += " L" + (x - 3) + " " + mid + " L" + x + " " + y + " L" + (x + 3) + " " + mid; else d += " L" + x + " " + mid;
  });
  d += " L" + W + " " + mid;
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", d); path.setAttribute("fill", "none"); path.setAttribute("stroke", "#ff6a1a");
  path.setAttribute("stroke-width", "1.5"); path.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(path);
  return svg;
}

async function loadHistory(m, box) {
  box.textContent = "Loading...";
  const [snaps, checks] = await Promise.all([api("/api/monitors/" + m.id + "/snapshots"), api("/api/monitors/" + m.id + "/checks")]);
  box.textContent = "";
  box.appendChild(el("div", null, "Versions saved: " + snaps.length));
  snaps.slice(0, 8).forEach((s) => {
    const row = el("div", null, fmt(s.created_at) + "  ");
    const a = el("a", null, "screenshot"); a.href = "/shots/" + m.id + "/" + s.id + ".png"; a.target = "_blank"; a.rel = "noopener";
    row.appendChild(a); box.appendChild(row);
  });
  box.appendChild(el("div", null, "Recent checks"));
  checks.slice(0, 8).forEach((c) => box.appendChild(el("div", null, fmt(c.checked_at) + "  " + c.outcome + (c.detail ? " (" + c.detail + ")" : ""))));
}

function card(m, checks) {
  const c = el("div", "card");
  const top = el("div", "row");
  const left = el("div"); left.appendChild(el("div", "name", m.name)); left.appendChild(el("div", "url", m.url));
  top.appendChild(left); top.appendChild(el("span", "pill " + m.status, m.status));
  c.appendChild(top);
  c.appendChild(trace(checks));
  const meta = el("div", "meta");
  [["Checked", fmt(m.last_checked)], ["Changed", fmt(m.last_changed)], ["Every", m.interval_min + " min"]].forEach(([k, v]) => {
    const s = el("span", null, k + " "); s.appendChild(el("b", null, v)); meta.appendChild(s);
  });
  c.appendChild(meta);
  if (m.last_error) c.appendChild(el("div", "err", m.last_error));
  const actions = el("div", "actions"), hist = el("div", "hist");
  const check = el("button", null, "Check now"), show = el("button", null, "History"), del = el("button", null, "Delete");
  check.onclick = async () => {
    check.disabled = true; check.textContent = "Checking...";
    try { const r = await api("/api/monitors/" + m.id + "/check", { method: "POST" }); say(m.name + ": " + r.outcome + (r.detail ? " (" + r.detail + ")" : "")); }
    catch (e) { say(e.message, true); }
    refresh();
  };
  show.onclick = () => { if (hist.textContent) hist.textContent = ""; else loadHistory(m, hist).catch((e) => say(e.message, true)); };
  del.onclick = async () => { if (del.dataset.sure) { await api("/api/monitors/" + m.id, { method: "DELETE" }); refresh(); } else { del.dataset.sure = 1; del.textContent = "Tap again to delete"; } };
  actions.append(check, show, del); c.append(actions, hist);
  return c;
}

async function refresh() {
  try {
    const monitors = await api("/api/monitors");
    const all = await Promise.all(monitors.map((m) => api("/api/monitors/" + m.id + "/checks").catch(() => [])));
    const list = $("list"); list.textContent = "";
    if (!monitors.length) list.appendChild(el("div", "empty", "No monitors yet. Add a page above."));
    monitors.forEach((m, i) => list.appendChild(card(m, all[i])));
  } catch (e) { say(e.message, true); }
}

$("add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = $("addBtn"); btn.disabled = true; btn.textContent = "Adding...";
  try {
    const m = await api("/api/monitors", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: $("name").value, url: $("url").value, interval_min: Number($("interval").value) }) });
    btn.textContent = "Checking (can take 20s)...";
    const r = await api("/api/monitors/" + m.id + "/check", { method: "POST" });
    say(m.name + ": " + r.outcome + (r.detail ? " (" + r.detail + ")" : ""));
    $("name").value = ""; $("url").value = "";
  } catch (e) { say(e.message, true); }
  btn.disabled = false; btn.textContent = "Add and check now";
  refresh();
});

refresh();
</script>
</body>
</html>
